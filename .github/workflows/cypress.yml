name: CI Cypress

on:
  push:
    branches: ["alumno/jvicenter"]
  pull_request:
    branches: ["dev"]

concurrency:
  group: ci-cypress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar deps
        run: npm ci

      - name: Run Cypress E2E
        run: npm run cy:run:taller5:spec2

      - name: Generate
        run: npm run allure:generate
      
      - name: Upload artifacts reports and screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cypress-artifacts
          path: |
            artifacts
          retention-days: 1